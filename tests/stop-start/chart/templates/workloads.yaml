{{- /*
  The shapes `meridian stop` and `start` read, as meridian-runtime labels
  them: components as Deployments, a launched plugin among them, the
  database's StatefulSet (component database, with a volume of its own), the
  broker's StatefulSet, which a stop leaves running, and the release's
  CronJobs. Nothing here does any work: pause, and busybox where a pod must
  take its time to stop or to be ready.
*/ -}}
{{- $name := printf "%s-meridian-runtime" .Release.Name }}
{{- range $component, $replicas := dict "conductor" 1 "lake" 1 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-{{ $component }}
  labels: { app.kubernetes.io/instance: {{ $.Release.Name }}, meridian.dev/component: {{ $component }} }
spec:
  replicas: {{ $replicas }}
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ $.Release.Name }}, meridian.dev/component: {{ $component }} }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ $.Release.Name }}, meridian.dev/component: {{ $component }} }
    spec:
      containers:
        - name: {{ $component }}
          image: registry.k8s.io/pause:3.10
          {{- if and $.Values.hang (eq $component "conductor") }}
          readinessProbe: { tcpSocket: { port: 1 }, periodSeconds: 2 }
          {{- end }}
{{- end }}
---
# Slow to stop (sleep ignores SIGTERM: it waits out its grace) and slow to be
# ready: what a session cut short leaves half done.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-dashboard
  labels: { app.kubernetes.io/instance: {{ .Release.Name }}, meridian.dev/component: dashboard }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, meridian.dev/component: dashboard }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, meridian.dev/component: dashboard }
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: dashboard
          image: busybox:1.36.1
          command: ["sleep", "3600"]
          readinessProbe: { exec: { command: ["true"] }, initialDelaySeconds: 15, periodSeconds: 2 }
---
# A launched plugin: the release's labels, as the launcher gives them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-plugin-sample
  labels: { app.kubernetes.io/instance: {{ .Release.Name }}, meridian.dev/launched: "true", meridian.dev/instance: sample }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, meridian.dev/instance: sample }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, meridian.dev/instance: sample, meridian.dev/launched: "true" }
    spec:
      containers:
        - { name: plugin, image: "registry.k8s.io/pause:3.10" }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}-database
  labels: { app.kubernetes.io/instance: {{ .Release.Name }} }
spec:
  replicas: 1
  serviceName: {{ $name }}-database
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, meridian.dev/component: database }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, meridian.dev/component: database }
    spec:
      containers:
        - name: postgres
          image: registry.k8s.io/pause:3.10
          volumeMounts: [ { name: data, mountPath: /data } ]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 16Mi } } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}-broker
  labels: { app.kubernetes.io/instance: {{ .Release.Name }} }
spec:
  replicas: 1
  serviceName: {{ $name }}-broker
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, meridian.dev/component: broker }
  template:
    metadata:
      labels: { app.kubernetes.io/instance: {{ .Release.Name }}, meridian.dev/component: broker }
    spec:
      containers:
        - { name: broker, image: "registry.k8s.io/pause:3.10" }
{{- range $cronjob, $spec := dict "backup" (dict "suspend" false "component" "backup") "scrub" (dict "suspend" true "component" "scrub") "database-offline" (dict "suspend" true "component" "database-offline") }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ if eq $cronjob "database-offline" }}{{ $name }}-database-offline{{ else }}{{ $name }}-{{ $cronjob }}{{ end }}
  labels: { app.kubernetes.io/instance: {{ $.Release.Name }}, meridian.dev/component: {{ $spec.component }} }
spec:
  schedule: "0 3 * * *"
  suspend: {{ $spec.suspend }}
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - { name: {{ $cronjob }}, image: "busybox:1.36.1", command: ["true"] }
{{- end }}
