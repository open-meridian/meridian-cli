# One artifact per target, built on that target's own runner.
#
# No package manager in the first pass (spec/the-cli, ruling 2): a formula that
# lags the release is worse than a download. A tag is what publishes; nothing
# here runs on a push to main.
#
# Linux is statically linked against musl, so the binary runs on whatever a
# firm's build agent happens to be. One dependency compiles C, the TLS
# provider aws-lc-rs (spec/the-cli, requirement 2; `make check-c-deps` holds
# it to one), so the Linux runners are given musl's C compiler and nothing
# else. macOS has Xcode's.
#
# A tag publishes. Run by hand (workflow_dispatch) it builds every target and
# publishes nothing: the way to find out a release would build before cutting
# one.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-14
            target: aarch64-apple-darwin
          # GitHub has retired its Intel macOS runners; Apple's toolchain
          # builds Intel binaries on Apple silicon.
          - runner: macos-14
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: musl's C compiler, for the C the TLS provider compiles
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - run: rustup toolchain install 1.90 --profile minimal
      - run: rustup target add ${{ matrix.target }} --toolchain 1.90

      - run: cargo +1.90 build --release --locked --target ${{ matrix.target }}

      - name: Name it for the target it runs on
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/meridian dist/meridian-${{ matrix.target }}
          # From inside dist, so the file names the binary as it is
          # downloaded and `shasum -a 256 -c` works beside it.
          cd dist && shasum -a 256 meridian-${{ matrix.target }} > meridian-${{ matrix.target }}.sha256

      - name: It runs, and says what it is
        if: matrix.target != 'x86_64-apple-darwin'
        run: dist/meridian-${{ matrix.target }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: meridian-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
