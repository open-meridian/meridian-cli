# What `make ci-local` runs, run again on the runner.
#
# One job calling one target, so there is nothing for CI and the local gate to
# disagree about. The other workflows' jobs -- a release's builds, closing an
# outside pull request, the macOS trust test -- cannot run in ci-local, and
# ci-mirror-check (inside ci-local) holds each to a written reason in
# tools/ci-mirror-allowlist.txt.

name: ci

# On the pull request and by hand, and not again on main: a change lands
# through a pull request that must be up to date with main and merges with a
# merge commit, so the tree this run passed is the tree the merge puts on main
# (the product owner, 2026-10-14).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: make ci-local
