# What `make ci-local` runs, run again on the runner.
#
# One job calling one target, so there is nothing for CI and the local gate to
# disagree about. meridian-core needs a mirror check because its gates are
# many and CI names them individually; this has three, inside Docker, and the
# way to keep them in step is not to write them down twice.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: make ci-local
