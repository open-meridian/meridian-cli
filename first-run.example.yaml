# The wizard's answers, and no credential.
#
# Every field the wizard asks for as a password is read from MERIDIAN_<FIELD>
# instead -- MERIDIAN_DB_SERVING_PASSWORD for db_serving_password, and so on --
# and a file naming one is refused with the variable to use. A params file that
# works with the passwords in it is a params file that gets committed.
#
# The names are the wizard's own. `meridian up --params` reads the form the
# deployment serves and refuses a field it does not ask for, so nothing here is
# a list that can drift.

# The database. Two roles on one database: the migrating role may create a
# table and the serving role must not. Both are tested before anything is
# written.
db_host: postgres.internal
db_port: 5432
db_name: meridian
db_sslmode: require
db_serving_role: meridian_app
db_migrating_role: meridian_migrate

# Signing in: one of `local`, `ldap` or `oidc`, and only that one's fields.
#
# `local` -- the firm has no directory, and this deployment holds one account
# for you. Its password is read from MERIDIAN_ADMIN_PASSWORD.
backend: local
admin_login: ada
admin_email: ada@firm.example
admin_given_name: Ada
admin_family_name: Park

# `ldap` -- the firm's LDAP or Active Directory. The bind password is read from
# MERIDIAN_LDAP_BIND_PASSWORD. ldap_start_tls: "on" for an ldap:// address.
#
#   backend: ldap
#   ldap_servers: ldaps://ldap.firm.internal:636
#   ldap_base_dn: ou=people,dc=firm,dc=internal
#   ldap_bind_dn: cn=meridian,ou=services,dc=firm,dc=internal
#   ldap_user_filter: (uid={})
#   admin_group: meridian-admins
#
# `oidc` -- the firm's own OpenID Connect provider. The issuer exactly as the
# provider states it; the client secret, if any, from
# MERIDIAN_OIDC_CLIENT_SECRET.
#
#   backend: oidc
#   oidc_issuer: https://login.firm.example
#   oidc_client_id: meridian
#   oidc_groups_claim: groups
#   admin_group: meridian-admins

# Where a browser reaches this deployment. A firm's own provider sends people
# back to it.
dashboard_url: https://meridian.firm.example
