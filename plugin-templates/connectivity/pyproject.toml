[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reference-plugin"
version = "0.1.0"
description = "A Meridian connectivity plugin"
requires-python = ">=3.11"
# The SDK and nothing else of Meridian's, pinned exactly: the sidecar this runs
# beside speaks one version of the contract, and a range would let a rebuild
# pick up another.
dependencies = ["open-meridian==0.33.3"]

[project.scripts]
reference-plugin = "reference_plugin.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

# What this plugin says about itself, which `meridian plugin upload` sends and
# a deployment admin approves before it runs (W8). Declarations, not grants.
[tool.meridian]
# Roles from the deployment's fixed list, fifteen -- compliance, confirmation, connectivity,
# custody, data, ems, oms, operations, portfolio, pricing, reference, reporting, servicing,
# settlement, signal
# -- and its grants are theirs. `connectivity`: it places what its ems released
# at a venue and reports what the venue did, W11's steps.
roles = ["connectivity"]
# Whether it serves a page through its sidecar.
interface = true
# Its declaration: its settings, pages and tools, and its documentation in
# docs/. Upload reads it from the built image with `meridian-declaration`.
declaration = "reference_plugin.declaration:DECLARATION"
